<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumeco — seu bichinho de luz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">

  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph">✦</span>
      <span class="brand-name">Lumeco</span>
    </div>
    <div class="age-chip">
      <span id="stageLabel">Ovo</span>
      <span class="age-dot">·</span>
      <span id="ageLabel">dia 0</span>
    </div>
  </header>

  <main class="terrarium-wrap">
    <section class="terrarium" id="terrarium">
      <div class="terrarium-glow" id="terrariumGlow"></div>
      <div class="floor"></div>
      <div class="blanket" id="blanket"></div>
      <div class="creature-holder">
        <div class="pillow" id="pillow"></div>
        <svg id="creatureSvg" viewBox="0 0 200 200" class="creature">
          <!-- preenchido via JS -->
        </svg>
        <div class="shadow" id="creatureShadow"></div>
      </div>
      <button class="toy" id="toyBtn" title="Brincar">🧸</button>
      <div class="bubble" id="speechBubble"></div>
      <div class="sparkles" id="sparkles"></div>
    </section>

    <p class="hint" id="hint">Toque em Alimentar, Dormir ou Banho para cuidar dele.</p>
  </main>

  <section class="stats" aria-label="Status do bichinho">
    <div class="stat" data-stat="fome">
      <div class="stat-head">
        <span class="stat-icon">◆</span>
        <span class="stat-name">Fome</span>
        <span class="stat-value" id="valFome">100</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barFome"></div></div>
    </div>
    <div class="stat" data-stat="sono">
      <div class="stat-head">
        <span class="stat-icon">◆</span>
        <span class="stat-name">Sono</span>
        <span class="stat-value" id="valSono">100</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barSono"></div></div>
    </div>
    <div class="stat" data-stat="higiene">
      <div class="stat-head">
        <span class="stat-icon">◆</span>
        <span class="stat-name">Higiene</span>
        <span class="stat-value" id="valHigiene">100</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barHigiene"></div></div>
    </div>
    <div class="stat glow-stat" data-stat="brilho">
      <div class="stat-head">
        <span class="stat-icon">✦</span>
        <span class="stat-name">Brilho</span>
        <span class="stat-value" id="valBrilho">100</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barBrilho"></div></div>
    </div>
  </section>

  <section class="room" aria-label="Itens do quarto">
    <div class="room-head">
      <span class="room-title">Quarto</span>
      <span class="room-sub">toque para equipar</span>
    </div>
    <div class="shelf">
      <button class="item-toggle" id="itemCobertor" data-item="cobertor">
        <span class="item-icon">🧣</span>
        <span class="item-name">Cobertor</span>
        <span class="item-desc">sono cai mais devagar</span>
      </button>
      <button class="item-toggle" id="itemTravesseiro" data-item="travesseiro">
        <span class="item-icon">🛏️</span>
        <span class="item-name">Travesseiro</span>
        <span class="item-desc">dormir rende mais</span>
      </button>
      <button class="item-toggle" id="itemBrinquedo" data-item="brinquedo">
        <span class="item-icon">🧸</span>
        <span class="item-name">Brinquedo</span>
        <span class="item-desc">aparece pra brincar</span>
      </button>
    </div>
  </section>

  <section class="farm" aria-label="Fazenda">
    <div class="room-head">
      <span class="room-title">Fazenda</span>
      <span class="room-sub" id="farmSub">toque num canteiro vazio</span>
    </div>
    <div class="plots" id="plots"></div>
    <div class="inventory" id="inventory"></div>
  </section>

  <section class="pond" aria-label="Lago">
    <div class="room-head">
      <span class="room-title">Lago</span>
      <span class="room-sub">pesque na hora certa</span>
    </div>
    <div class="pond-box" id="pondBox">
      <button class="pond-btn" id="btnFish">Pescar</button>
      <div class="fish-game hidden" id="fishGame">
        <div class="fish-track">
          <div class="fish-zone"></div>
          <div class="fish-marker" id="fishMarker"></div>
        </div>
        <button class="catch-btn" id="btnCatch">Fisgar!</button>
      </div>
      <p class="pond-msg" id="pondMsg"></p>
    </div>
  </section>

  <section class="kitchen" aria-label="Cozinha">
    <div class="room-head">
      <span class="room-title">Cozinha</span>
      <span class="room-sub">escolha 2 ou 3 ingredientes</span>
    </div>
    <div class="ingredients" id="ingredients"></div>
    <div class="cook-row">
      <button class="cook-btn" id="btnCook" disabled>Cozinhar</button>
    </div>
    <div class="naming hidden" id="namingBox">
      <input type="text" id="dishNameInput" maxlength="24" placeholder="Nome do prato novo...">
      <button class="name-confirm" id="btnConfirmName">Salvar</button>
      <button class="name-cancel" id="btnCancelName">cancelar</button>
    </div>
    <div class="dishes" id="dishes"></div>
  </section>

  <nav class="actions">
    <button class="action-btn" id="btnFeed" data-action="fome">
      <span class="action-icon">🍓</span>
      <span>Alimentar</span>
    </button>
    <button class="action-btn" id="btnSleep" data-action="sono">
      <span class="action-icon">☾</span>
      <span>Dormir</span>
    </button>
    <button class="action-btn" id="btnClean" data-action="higiene">
      <span class="action-icon">✧</span>
      <span>Banho</span>
    </button>
  </nav>

  <footer class="footer">
    <button class="reset-link" id="btnReset">recomeçar</button>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>

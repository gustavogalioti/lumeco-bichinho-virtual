<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raiz — sua árvore cresce com você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<div class="scene">

  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph">🌱</span>
      <span class="brand-name" id="brandName">Sua semente</span>
    </div>
    <div class="age-chip">
      <span id="stageLabel">Semente</span>
      <span class="age-dot">·</span>
      <span id="heightLabel">0 cm</span>
    </div>
  </header>

  <main class="garden-wrap">
    <section class="garden" id="garden">
      <div class="sky" id="sky"></div>
      <div class="ground"></div>
      <div class="tree-holder">
        <svg id="treeSvg" viewBox="0 0 200 220" class="tree"></svg>
      </div>
      <div class="bubble" id="speechBubble"></div>
      <div class="sparkles" id="sparkles"></div>
      <div class="dock" id="actionDock">
        <button class="dock-btn" id="btnWater" title="Regar">💧</button>
      </div>
    </section>

    <p class="hint" id="hint">Regue todo dia pra sua semente brotar.</p>
    <p class="equivalence" id="equivalence"></p>
  </main>

  <div class="birth-card hidden" id="birthCard">
    <p class="birth-title">Sua árvore nasceu! 🌿</p>
    <p class="birth-species" id="birthSpecies"></p>
    <div class="naming">
      <input type="text" id="treeNameInput" maxlength="24" placeholder="Dê um nome a ela...">
      <button class="name-confirm" id="btnConfirmTreeName">Batizar</button>
    </div>
  </div>

  <section class="chat-section" aria-label="Conversar">
    <div class="room-head">
      <span class="room-title">Conversar</span>
      <span class="room-sub" id="chatSub">configure o servidor</span>
    </div>

    <p class="chat-locked hidden" id="chatLocked">Ela ainda não brotou — converse com ela assim que sair da terra.</p>

    <div class="chat-setup hidden" id="chatSetup">
      <input type="text" id="workerUrlInput" placeholder="Cole a URL do seu Worker (https://...)">
      <button class="name-confirm" id="btnSaveWorker">Salvar</button>
    </div>

    <div class="chat-box hidden" id="chatBox">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" maxlength="300" placeholder="Fale com sua árvore...">
        <button class="name-confirm" id="btnSendChat">Enviar</button>
      </div>
      <button class="name-cancel" id="btnReconfigWorker">trocar servidor</button>
    </div>
  </section>

  <section class="stats" aria-label="Status da árvore">
    <div class="stat" data-stat="agua">
      <div class="stat-head">
        <span class="stat-icon">◆</span>
        <span class="stat-name">Água</span>
        <span class="stat-value" id="valAgua">100</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barAgua"></div></div>
    </div>
    <div class="stat glow-stat" data-stat="crescimento">
      <div class="stat-head">
        <span class="stat-icon">✦</span>
        <span class="stat-name">Crescimento</span>
        <span class="stat-value" id="valCrescimento">0</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barCrescimento"></div></div>
    </div>
  </section>

  <footer class="footer">
    <button class="reset-link" id="btnReset">recomeçar</button>
  </footer>

</div>

<script src="script.js?v=1"></script>
</body>
</html>
